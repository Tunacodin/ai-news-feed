name: news
on:
  schedule:
    - cron: "5 * * * *"   # her saatin 5. dakikasinda (yuk ani daha az)
  workflow_dispatch: {}    # elle de tetiklenebilir
permissions:
  contents: write          # repoya commit atabilmek icin
concurrency: news          # ust uste binmeyi engeller
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser
      - run: python fetch_news.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: python trendler.py   # GitHub/HF/Show HN/Product Hunt trend fotografi
      - run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "news $(date -u +%FT%TZ)" || echo "degisiklik yok"
          # bot.yml de main'e yaziyor; cakisirsa guncelleyip tekrar dene
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
